name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite project
        env:
          VITE_API_BASE_URL: https://d4qlj85684.execute-api.ap-south-1.amazonaws.com
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm run build

          # Generate page-specific SEO metadata and HTML
          node scripts/generate-route-pages.mjs

          # Keep fallback for unknown routes
          cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

      - name: Wait for Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in $(seq 1 18); do
            echo "Checking artifact availability: attempt $attempt/18"

            count=$(gh api               "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages"               --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length') || count=0

            if [ "$count" = "1" ]; then
              echo "PASS: Pages artifact is available"
              exit 0
            fi

            if [[ "$count" =~ ^[0-9]+$ ]] && [ "$count" -gt 1 ]; then
              echo "::error::Multiple Pages artifacts found"
              exit 1
            fi

            sleep 10
          done

          echo "::error::Pages artifact unavailable after 180 seconds"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
